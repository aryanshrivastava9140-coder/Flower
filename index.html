<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bloom</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #170014;
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
}
</style>
</head>

<body>

<canvas id="flower"></canvas>

<script>

const canvas = document.getElementById("flower");
const ctx = canvas.getContext("2d");

let W, H;
let startTime = performance.now();

function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;

    ctx.lineCap = "round";
    ctx.lineJoin = "round";
}

window.addEventListener("resize", resize);
resize();


// -----------------------------
// SETTINGS
// -----------------------------

const flowerX = () => W / 2;
const flowerY = () => H * 0.43;

const stemBottom = () => H * 0.78;

let hearts = [];


// -----------------------------
// SMALL HEART
// -----------------------------

function heart(x, y, s, alpha) {

    ctx.save();

    ctx.globalAlpha = alpha;
    ctx.strokeStyle = "#ff72bd";
    ctx.lineWidth = 1;

    ctx.beginPath();

    ctx.moveTo(x, y + s);

    ctx.bezierCurveTo(
        x - s * 1.5,
        y - s * 0.2,
        x - s,
        y - s,
        x,
        y - s * 0.25
    );

    ctx.bezierCurveTo(
        x + s,
        y - s,
        x + s * 1.5,
        y - s * 0.2,
        x,
        y + s
    );

    ctx.stroke();

    ctx.restore();
}


// -----------------------------
// STEM
// -----------------------------

function drawStem(progress) {

    if (progress <= 0) return;

    let bottom = stemBottom();
    let top = flowerY() + 20;

    let current =
        bottom - (bottom - top) * progress;

    ctx.strokeStyle = "#238b52";
    ctx.lineWidth = 2;

    ctx.beginPath();

    ctx.moveTo(flowerX(), bottom);

    for (let y = bottom; y >= current; y -= 2) {

        let t =
            (bottom - y) /
            (bottom - top);

        let bend =
            Math.sin(t * 3.5) * 14 +
            Math.sin(t * 9) * 3;

        ctx.lineTo(
            flowerX() + bend,
            y
        );
    }

    ctx.stroke();
}


// -----------------------------
// LEAF
// -----------------------------

function drawLeaf(x, y, size, angle, progress) {

    if (progress <= 0) return;

    ctx.save();

    ctx.translate(x, y);
    ctx.rotate(angle);

    ctx.globalAlpha = progress;

    ctx.strokeStyle = "#21884e";
    ctx.fillStyle = "#126d3e";
    ctx.lineWidth = 1.5;

    ctx.beginPath();

    ctx.moveTo(0, 0);

    ctx.quadraticCurveTo(
        size * 0.5,
        -size * 0.6,
        size,
        0
    );

    ctx.quadraticCurveTo(
        size * 0.5,
        size * 0.6,
        0,
        0
    );

    ctx.stroke();
    ctx.fill();

    ctx.beginPath();

    ctx.moveTo(0, 0);
    ctx.lineTo(size, 0);

    ctx.stroke();

    ctx.restore();
}


// -----------------------------
// ONE LOOPING PETAL
// -----------------------------

function petalLoop(
    cx,
    cy,
    radius,
    size,
    rotation,
    progress,
    color
) {

    if (progress <= 0) return;

    ctx.save();

    ctx.translate(cx, cy);
    ctx.rotate(rotation);

    ctx.strokeStyle = color;
    ctx.lineWidth = 1.25;

    ctx.globalAlpha = 0.85;

    let total = Math.PI * 2;
    let end = total * progress;

    ctx.beginPath();

    for (let a = 0; a <= end; a += 0.045) {

        /*
         * This creates the characteristic
         * looping/scribbled flower petals.
         */

        let wave =
            Math.sin(a * 2.5) * size * 0.25;

        let r =
            radius +
            Math.sin(a * 5) * size * 0.18;

        let x =
            Math.cos(a) * (r + wave);

        let y =
            Math.sin(a) *
            (r * 0.48);

        // Slight irregularity
        x += Math.sin(a * 13) * 1.5;
        y += Math.cos(a * 11) * 1.2;

        if (a === 0)
            ctx.moveTo(x, y);
        else
            ctx.lineTo(x, y);
    }

    ctx.stroke();

    ctx.restore();
}


// -----------------------------
// FLOWER
// -----------------------------

function drawFlower(progress) {

    if (progress <= 0) return;

    const x = flowerX();
    const y = flowerY();

    /*
     * Many rings are used.
     * This is what makes the final flower
     * look dense like the video.
     */

    const rings = [

        [4, 7, 10, "#ffb8df"],
        [9, 9, 13, "#ff9bd3"],
        [15, 11, 15, "#ff83c9"],
        [22, 13, 18, "#ff69bf"],
        [30, 15, 21, "#ff55b5"],
        [38, 17, 23, "#f947aa"],
        [46, 19, 25, "#f238a0"],
        [54, 21, 27, "#e92f98"],
        [62, 23, 29, "#df268f"]
    ];


    rings.forEach((ring, index) => {

        let radius = ring[0];
        let count = ring[1];
        let size = ring[2];
        let color = ring[3];

        /*
         * Rings appear one after another.
         */

        let delay = index * 0.075;

        let p =
            Math.max(
                0,
                Math.min(
                    1,
                    (progress - delay) / 0.22
                )
            );


        for (let i = 0; i < count; i++) {

            let angle =
                (Math.PI * 2 / count) * i;

            /*
             * Random-looking but deterministic
             * variation.
             */

            let offset =
                Math.sin(index * 7 + i * 13) * 5;

            petalLoop(
                x + Math.cos(angle) * radius * 0.25,
                y + Math.sin(angle) * radius * 0.20,

                radius + offset,

                size,

                angle +
                Math.sin(i * 3 + index) * 0.25,

                p,

                color
            );
        }
    });


    // Bright center

    let center =
        Math.min(
            1,
            Math.max(0, progress - 0.3) / 0.5
        );

    if (center > 0) {

        ctx.save();

        ctx.globalAlpha = center * 0.7;

        ctx.fillStyle = "#ff9ed5";

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            5 + center * 5,
            0,
            Math.PI * 2
        );

        ctx.fill();

        ctx.restore();
    }
}


// -----------------------------
// FLOATING HEARTS
// -----------------------------

function createHearts() {

    hearts = [];

    for (let i = 0; i < 22; i++) {

        hearts.push({

            x:
                flowerX() +
                (Math.random() - 0.5) * 270,

            y:
                flowerY() -
                40 -
                Math.random() * 220,

            size:
                3 + Math.random() * 3,

            delay:
                Math.random() * 0.5
        });
    }
}


function drawHearts(progress) {

    hearts.forEach(h => {

        let p =
            Math.max(
                0,
                Math.min(
                    1,
                    (progress - h.delay) / 0.4
                )
            );

        if (p <= 0) return;

        heart(
            h.x,
            h.y,
            h.size,
            p * 0.7
        );
    });
}


// -----------------------------
// MAIN ANIMATION
// -----------------------------

function animate(time) {

    let elapsed =
        (time - startTime) / 1000;

    /*
     * 0 - 3 sec:
     * stem
     *
     * 2 - 10 sec:
     * flower grows
     *
     * 9 - 12 sec:
     * hearts appear
     *
     * then restart
     */

    let cycle =
        elapsed % 13;

    // Background

    ctx.fillStyle = "#170014";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    // -------------------------
    // STEM
    // -------------------------

    let stemProgress =
        Math.min(
            1,
            cycle / 3
        );

    drawStem(stemProgress);


    // -------------------------
    // LEAVES
    // -------------------------

    if (cycle > 1.5) {

        let leafProgress =
            Math.min(
                1,
                (cycle - 1.5) / 1.5
            );

        drawLeaf(
            flowerX() - 5,
            H * 0.63,
            38,
            -0.5,
            leafProgress
        );
    }


    if (cycle > 2.3) {

        let leafProgress =
            Math.min(
                1,
                (cycle - 2.3) / 1.5
            );

        drawLeaf(
            flowerX() + 1,
            H * 0.70,
            32,
            0.45,
            leafProgress
        );
    }


    // -------------------------
    // FLOWER
    // -------------------------

    if (cycle > 2.5) {

        let flowerProgress =
            Math.min(
                1,
                (cycle - 2.5) / 6.5
            );

        drawFlower(
            flowerProgress
        );
    }


    // -------------------------
    // FLOATING HEARTS
    // -------------------------

    if (cycle > 8.5) {

        let heartProgress =
            Math.min(
                1,
                (cycle - 8.5) / 2
            );

        drawHearts(
            heartProgress
        );
    }


    requestAnimationFrame(animate);
}


createHearts();

requestAnimationFrame(animate);

</script>

</body>
</html>
