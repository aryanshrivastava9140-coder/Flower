<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blooming Heart Flower</title>

<style>
    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
    }

    canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        background: #170013;
    }
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let W, H;

function resize() {
    W = canvas.width = window.innerWidth * devicePixelRatio;
    H = canvas.height = window.innerHeight * devicePixelRatio;

    canvas.style.width = window.innerWidth + "px";
    canvas.style.height = window.innerHeight + "px";

    ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
}

resize();
window.addEventListener("resize", resize);


// --------------------------------------------------
// SETTINGS
// --------------------------------------------------

const CX = () => window.innerWidth / 2;
const FLOWER_Y = () => window.innerHeight * 0.43;

let progress = 0;
let particles = [];


// --------------------------------------------------
// HEART / PETAL SHAPE
// --------------------------------------------------

function drawPetal(x, y, angle, length, width, color, amount) {

    ctx.save();

    ctx.translate(x, y);
    ctx.rotate(angle);

    ctx.strokeStyle = color;
    ctx.lineWidth = 1.6;
    ctx.lineCap = "round";

    ctx.beginPath();

    let steps = 32;

    for (let i = 0; i <= steps * amount; i++) {

        let t = i / steps;

        let px =
            Math.sin(t * Math.PI) * width
            + t * length;

        let py =
            Math.sin(t * Math.PI * 2) * width * 0.42;

        // Slight natural variation
        py += Math.sin(t * 13) * 1.2;

        if (i === 0)
            ctx.moveTo(px, py);
        else
            ctx.lineTo(px, py);
    }

    ctx.stroke();

    // second curved side
    ctx.beginPath();

    for (let i = 0; i <= steps * amount; i++) {

        let t = i / steps;

        let px =
            Math.sin(t * Math.PI) * width
            + t * length;

        let py =
            -Math.sin(t * Math.PI * 2) * width * 0.42;

        py += Math.sin(t * 11) * 1.0;

        if (i === 0)
            ctx.moveTo(px, py);
        else
            ctx.lineTo(px, py);
    }

    ctx.stroke();

    ctx.restore();
}


// --------------------------------------------------
// STEM
// --------------------------------------------------

function drawStem(amount) {

    const x = CX();
    const bottom = FLOWER_Y() + 210;
    const top = FLOWER_Y() + 25;

    let current = bottom - (bottom - top) * amount;

    ctx.strokeStyle = "#258b57";
    ctx.lineWidth = 2;

    ctx.beginPath();

    ctx.moveTo(x, bottom);

    for (let y = bottom; y >= current; y -= 2) {

        let t = (bottom - y) / (bottom - top);

        let bend =
            Math.sin(t * 3.2) * 12 +
            Math.sin(t * 7) * 3;

        ctx.lineTo(x + bend, y);
    }

    ctx.stroke();
}


// --------------------------------------------------
// LEAF
// --------------------------------------------------

function drawLeaf(x, y, angle, size, amount) {

    ctx.save();

    ctx.translate(x, y);
    ctx.rotate(angle);

    ctx.strokeStyle = "#16834d";
    ctx.fillStyle = "#126b40";
    ctx.lineWidth = 1.5;

    ctx.beginPath();

    ctx.moveTo(0, 0);

    ctx.quadraticCurveTo(
        size * 0.55,
        -size * 0.55,
        size,
        0
    );

    ctx.quadraticCurveTo(
        size * 0.5,
        size * 0.55,
        0,
        0
    );

    ctx.stroke();

    ctx.globalAlpha = amount * 0.65;
    ctx.fill();

    ctx.globalAlpha = 1;

    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(size * 0.8, 0);
    ctx.stroke();

    ctx.restore();
}


// --------------------------------------------------
// FLOWER PETALS
// --------------------------------------------------

function drawFlower(amount) {

    const x = CX();
    const y = FLOWER_Y();

    // Different rings like the original Turtle effect
    const rings = [

        {
            radius: 8,
            count: 4,
            length: 42,
            width: 14,
            color: "#ffb6df",
            offset: 45
        },

        {
            radius: 18,
            count: 5,
            length: 55,
            width: 20,
            color: "#ff8ed0",
            offset: 0
        },

        {
            radius: 30,
            count: 7,
            length: 68,
            width: 25,
            color: "#ff67c3",
            offset: 25
        },

        {
            radius: 43,
            count: 9,
            length: 82,
            width: 31,
            color: "#f94fae",
            offset: 15
        },

        {
            radius: 58,
            count: 12,
            length: 100,
            width: 37,
            color: "#e93b9d",
            offset: 0
        }

    ];


    rings.forEach((ring, ringIndex) => {

        // Each ring appears after the previous one
        let ringStart = ringIndex * 0.12;

        let ringAmount =
            Math.max(
                0,
                Math.min(
                    1,
                    (amount - ringStart) / 0.25
                )
            );

        if (ringAmount <= 0) return;


        for (let i = 0; i < ring.count; i++) {

            let angle =
                (Math.PI * 2 / ring.count) * i
                + ring.offset * Math.PI / 180;

            let px =
                x +
                Math.cos(angle) * ring.radius;

            let py =
                y +
                Math.sin(angle) * ring.radius * 0.55;

            drawPetal(
                px,
                py,
                angle,
                ring.length,
                ring.width,
                ring.color,
                ringAmount
            );
        }
    });


    // Bright center
    if (amount > 0.25) {

        let centerAmount =
            Math.min(1, (amount - 0.25) / 0.5);

        ctx.save();

        ctx.globalAlpha = centerAmount * 0.8;
        ctx.fillStyle = "#ffb8e2";

        ctx.beginPath();
        ctx.arc(x, y, 8, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
    }
}


// --------------------------------------------------
// FLOATING HEARTS
// --------------------------------------------------

function createParticles() {

    particles = [];

    for (let i = 0; i < 18; i++) {

        particles.push({

            x: CX() + (Math.random() - 0.5) * 300,

            y: FLOWER_Y() -
               Math.random() * 190,

            size: 7 + Math.random() * 5,

            delay: Math.random() * 0.5,

            rotation:
                (Math.random() - 0.5) * 0.5
        });
    }
}


function drawHeart(x, y, size, rotation, alpha) {

    ctx.save();

    ctx.translate(x, y);
    ctx.rotate(rotation);

    ctx.globalAlpha = alpha;

    ctx.strokeStyle = "#ff8ecb";
    ctx.lineWidth = 1.1;

    ctx.beginPath();

    ctx.moveTo(0, size * 0.75);

    ctx.bezierCurveTo(
        -size * 1.2,
        -size * 0.05,
        -size * 0.9,
        -size,
        0,
        -size * 0.35
    );

    ctx.bezierCurveTo(
        size * 0.9,
        -size,
        size * 1.2,
        -size * 0.05,
        0,
        size * 0.75
    );

    ctx.stroke();

    ctx.restore();
}


function drawParticles(amount) {

    particles.forEach((p, i) => {

        let visible =
            Math.max(
                0,
                Math.min(
                    1,
                    (amount - p.delay) / 0.3
                )
            );

        if (visible <= 0) return;

        drawHeart(
            p.x,
            p.y,
            p.size,
            p.rotation,
            visible * 0.65
        );
    });
}


// --------------------------------------------------
// ANIMATION
// --------------------------------------------------

function animate() {

    ctx.clearRect(
        0,
        0,
        window.innerWidth,
        window.innerHeight
    );

    // Dark maroon background
    ctx.fillStyle = "#170013";

    ctx.fillRect(
        0,
        0,
        window.innerWidth,
        window.innerHeight
    );


    // -----------------------------------------------
    // TIMELINE
    // -----------------------------------------------

    let t = progress;


    // 0 → 0.30 : stem
    let stemAmount =
        Math.min(1, t / 0.30);

    drawStem(stemAmount);


    // Leaves appear after stem starts
    if (t > 0.18) {

        let leafAmount =
            Math.min(1, (t - 0.18) / 0.25);

        const x = CX();

        drawLeaf(
            x - 7,
            FLOWER_Y() + 105,
            -0.45,
            34,
            leafAmount
        );

        drawLeaf(
            x + 3,
            FLOWER_Y() + 150,
            0.45,
            28,
            leafAmount
        );
    }


    // Flower starts
    if (t > 0.28) {

        let flowerAmount =
            Math.min(1, (t - 0.28) / 0.62);

        drawFlower(flowerAmount);
    }


    // Floating hearts
    if (t > 0.72) {

        let particleAmount =
            Math.min(1, (t - 0.72) / 0.28);

        drawParticles(particleAmount);
    }


    progress += 0.006;


    // Restart after completion
    if (progress > 1.15) {

        progress = 0;

        createParticles();
    }


    requestAnimationFrame(animate);
}


// Start
createParticles();
animate();

</script>

</body>
</html>
